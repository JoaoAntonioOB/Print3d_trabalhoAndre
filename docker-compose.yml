name: print3d-mobile

services:
  postgres:
    image: postgres:16-alpine
    container_name: print3d-mobile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-print3d_mobile}
      POSTGRES_USER: ${POSTGRES_USER:-print3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (cp .env.example .env)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-print3d} -d ${POSTGRES_DB:-print3d_mobile}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
